<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dice-rs-ws Minimal</title>
<style>
:root {
    --malachite: #04e762;
    --selective-yellow: #f5b700;
    --celestial-blue: #00a1e4;
    --mexican-pink: #dc0073;
    --chartreuse: #89fc00;

    --malachite-1-adaptive: rgb(4, 208, 88);
    --malachite-3-adaptive: rgb(3, 162, 69);
    --celestial-blue-1-adaptive: rgb(0, 145, 205);

    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222631;
    --border: #2d3142;
    --text: #e0e0e8;
    --text-dim: #8888a0;

    --radius: 12px;

    --linear-gradient-3: linear-gradient(
        90deg,
        var(--mexican-pink) 0%,
        var(--celestial-blue-1-adaptive) 35%,
        var(--malachite-3-adaptive) 100%
    );
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }

body {
    background: var(--linear-gradient-3);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    width: 320px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    transition: width 0.25s ease;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
}

.sidebar.collapsed { width: 40px; }

.sidebar-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    cursor: pointer;
    user-select: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.sidebar.collapsed .sidebar-toggle { font-size: 1rem; }

.sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.sidebar.collapsed .sidebar-content { display: none; }

.sidebar-toggle-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    display: none;
    font-size: 0.75rem;
    color: var(--text-dim);
}

.sidebar.collapsed .sidebar-toggle-text { display: block; }
.sidebar.collapsed .sidebar-toggle-icon { display: none; }

/* Panels in sidebar */
.panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.panel-header h2 {
    font-size: 0.9rem;
    color: var(--text-dim);
    font-weight: 500;
}

.panel-collapse-arrow {
    cursor: pointer;
    user-select: none;
    font-size: 0.7rem;
    color: var(--text-dim);
    transition: transform 0.2s;
}

.panel-collapsible.collapsed .panel-collapse-arrow { transform: rotate(-90deg); }
.panel-collapsible.collapsed .panel-content { display: none; }

.row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }

.field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }

label { font-size: 0.8rem; color: var(--text-dim); }

input[type="text"], input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 0.85rem;
    width: 100%;
    box-sizing: border-box;
}

button {
    background: var(--celestial-blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
}

button:hover { filter: brightness(1.15); }
button:disabled { opacity: 0.4; cursor: default; }
button.danger { background: var(--mexican-pink); }

.status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 0.85rem;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
}

.status-dot.connected { background: var(--malachite); }
.status-dot.connecting { background: var(--selective-yellow); animation: pulse 1s infinite; }

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.device-list { list-style: none; }

.device-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    gap: 8px;
}

.device-info { display: flex; flex-direction: column; gap: 2px; }
.device-name { color: var(--text); }
.device-addr { color: var(--text-dim); font-size: 0.7rem; }
.device-rssi { color: var(--text-dim); font-size: 0.7rem; white-space: nowrap; }

.empty-state { color: var(--text-dim); text-align: center; padding: 16px; font-size: 0.8rem; }

/* Main area */
.main-area {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

.dice-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
    align-items: flex-start;
}

/* Big dice display */
.dice-tile {
    background: var(--surface);
    border: 4px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: border-color 0.3s;
    min-width: 200px;
}

.dice-tile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
    width: 100%;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-dim);
}

.dice-tile-header-left { display: flex; align-items: center; gap: 8px; }

.dice-tile-battery {
    font-size: 0.7rem;
    color: var(--text-dim);
    white-space: nowrap;
}

.dice-tile-color-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 500;
    color: #fff;
    background: var(--text-dim);
}

.dice-tile-face {
    font-size: 8rem;
    font-weight: 700;
    line-height: 1;
    padding: 40px 48px;
    color: var(--text);
    transition: color 0.2s;
    min-height: 208px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dice-tile-face.rolling { color: var(--selective-yellow); animation: shake 0.3s infinite; }
.dice-tile-face.stable { color: var(--malachite); }
.dice-tile-face.tilt-stable { color: var(--celestial-blue); }
.dice-tile-face.fake-stable { color: var(--mexican-pink); }
.dice-tile-face.move-stable { color: var(--chartreuse); }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

.dice-tile-status {
    font-size: 0.75rem;
    color: var(--text-dim);
    padding: 0 0 16px 0;
}

.sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}

.sidebar-footer a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 6px;
}

.sidebar-footer a:hover { color: var(--text); }

.sidebar.collapsed .sidebar-footer { display: none; }

.sidebar-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.sidebar-logo-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
}

.sidebar.collapsed .sidebar-logo { display: none; }

.dice-3d-scene {
    width: 40px;
    height: 40px;
    perspective: 200px;
    flex-shrink: 0;
}

.dice-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: dice-spin 8s infinite linear;
}

@keyframes dice-spin {
    0%   { transform: rotateX(-20deg) rotateY(0deg); }
    100% { transform: rotateX(-20deg) rotateY(360deg); }
}

.dice-3d-face {
    position: absolute;
    width: 40px;
    height: 40px;
    background: var(--surface);
    border: 2px solid var(--celestial-blue);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--celestial-blue);
    box-shadow: inset 0 0 8px rgba(0, 161, 228, 0.2);
}

.dice-3d-face.front  { transform: translateZ(20px); }
.dice-3d-face.back   { transform: rotateY(180deg) translateZ(20px); }
.dice-3d-face.right  { transform: rotateY(90deg) translateZ(20px); }
.dice-3d-face.left   { transform: rotateY(-90deg) translateZ(20px); }
.dice-3d-face.top    { transform: rotateX(90deg) translateZ(20px); }
.dice-3d-face.bottom { transform: rotateX(-90deg) translateZ(20px); }


.no-dice {
    color: var(--text-dim);
    font-size: 1rem;
    margin-top: 100px;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sidebar collapsed" id="sidebar">
    <div class="sidebar-toggle" onclick="toggleSidebar()">
        <span class="sidebar-toggle-icon">&#9664;</span>
        <span class="sidebar-toggle-text">Menu</span>
    </div>
    <div class="sidebar-content">
        <div class="sidebar-logo">
            <div class="dice-3d-scene">
                <div class="dice-3d">
                    <div class="dice-3d-face front">1</div>
                    <div class="dice-3d-face back">6</div>
                    <div class="dice-3d-face right">3</div>
                    <div class="dice-3d-face left">4</div>
                    <div class="dice-3d-face top">2</div>
                    <div class="dice-3d-face bottom">5</div>
                </div>
            </div>
            <span class="sidebar-logo-title">dice-rs</span>
        </div>
        <!-- Connection -->
        <div class="panel panel-collapsible" id="connectionPanel">
            <div class="panel-header">
                <h2>Webserver</h2>
                <span class="panel-collapse-arrow" onclick="togglePanelCollapse('connectionPanel')">&#9660;</span>
            </div>
            <div class="panel-content">
                <div class="status-bar">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Disconnected</span>
                </div>
                <div class="field-group">
                    <label>URL</label>
                    <input type="text" id="serverUrl" value="ws://localhost:3000/ws" placeholder="ws://host:port/ws">
                </div>
                <button id="connectBtn" onclick="toggleConnection()">Connect</button>
            </div>
        </div>

        <!-- Device Discovery -->
        <div class="panel panel-collapsible" id="discoveryPanel">
            <div class="panel-header">
                <h2>Device Discovery</h2>
                <span class="panel-collapse-arrow" onclick="togglePanelCollapse('discoveryPanel')">&#9660;</span>
            </div>
            <div class="panel-content">
                <div class="row">
                    <label>Duration</label>
                    <input type="number" id="scanDuration" value="5" min="1" max="30" style="max-width:60px; flex:none;">
                    <button id="scanBtn" onclick="sendScan()" disabled>Scan</button>
                </div>
                <ul class="device-list" id="deviceList">
                    <li class="empty-state">No devices scanned yet</li>
                </ul>
            </div>
        </div>
    </div>
    <div class="sidebar-footer">
        <a href="https://github.com/smearor/dice-rs" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span>github.com/smearor/dice-rs</span>
        </a>
    </div>
</div>

<div class="main-area">
    <div class="dice-grid" id="diceGrid">
        <div class="no-dice" id="noDice">No dice connected</div>
    </div>
</div>

<script>
let ws = null;
let connected = false;
let sessions = {};
let autoScanTimer = null;

function $(id) { return document.getElementById(id); }

function log(message, type) {
    const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
    const prefix = type === 'error' ? '[ERROR] ' : type === 'success' ? '[OK] ' : '';
    console.log('[' + ts + '] ' + prefix + message);
}

function toggleSidebar() {
    $('sidebar').classList.toggle('collapsed');
}

function togglePanelCollapse(id) {
    const panel = $(id);
    if (panel) panel.classList.toggle('collapsed');
}

function setStatus(state, text) {
    const dot = $('statusDot');
    dot.className = 'status-dot' + (state ? ' ' + state : '');
    $('statusText').textContent = text;
}

function toggleConnection() {
    if (ws) {
        ws.close();
        return;
    }
    const url = $('serverUrl').value.trim();
    if (!url) return;
    setStatus('connecting', 'Connecting...');
    log('Connecting to ' + url);
    try {
        ws = new WebSocket(url);
    } catch (err) {
        setStatus('', 'Error: ' + err.message);
        log('Connection error: ' + err.message, 'error');
        ws = null;
        return;
    }

    ws.onopen = function() {
        connected = true;
        setStatus('connected', 'Connected');
        $('connectBtn').textContent = 'Disconnect';
        $('scanBtn').disabled = false;
        log('WebSocket connected', 'success');
        sendScan();
    };

    ws.onclose = function() {
        connected = false;
        ws = null;
        setStatus('', 'Disconnected');
        $('connectBtn').textContent = 'Connect';
        $('scanBtn').disabled = true;
        clearAllSessions();
        log('WebSocket closed');
    };

    ws.onerror = function() {
        log('WebSocket error', 'error');
    };

    ws.onmessage = function(event) {
        let msg;
        try { msg = JSON.parse(event.data); } catch (err) {
            log('Parse error: ' + event.data, 'error');
            return;
        }
        handleMessage(msg);
    };
}

function send(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify(obj));
}

function handleMessage(msg) {
    switch (msg.type) {
        case 'ScanResults':
            log('Scan results: ' + msg.devices.length + ' device(s)', 'success');
            renderDeviceList(msg.devices);
            autoConnectDevices(msg.devices);
            break;
        case 'Success':
            log('[' + msg.session_id + '] ' + msg.message, 'success');
            if (msg.message === 'Connected') {
                addSession(msg.session_id);
            } else if (msg.message === 'Disconnected') {
                removeSession(msg.session_id);
            }
            break;
        case 'Error':
            log('[' + (msg.session_id || '--') + '] ERROR ' + msg.code + ': ' + msg.message, 'error');
            break;
        case 'Event':
            handleEvent(msg.session_id, msg.event);
            break;
        case 'BatteryLevel':
            updateBattery(msg.session_id, msg.level);
            log('[' + msg.session_id + '] Battery: ' + msg.level + '%');
            break;
        case 'SystemStatus':
            renderStatus(msg.session_id, msg.status);
            log('[' + msg.session_id + '] Status received');
            break;
        default:
            log('Unknown message: ' + JSON.stringify(msg), 'error');
    }
}

function autoConnectDevices(devices) {
    devices.forEach(function(dev) {
        send({ action: 'Connect', address: dev.address, dice_type: null });
        log('Auto-connecting to ' + dev.name + ' (' + dev.address + ')');
    });
}

function addSession(sid) {
    if (sessions[sid]) return;
    sessions[sid] = { rolling: false, currentFace: null, color: null };
    const noDice = $('noDice');
    if (noDice) noDice.remove();
    const tile = createDiceTile(sid);
    $('diceGrid').appendChild(tile);
    sendGetStatus(sid);
    sendGetBattery(sid);
}

function removeSession(sid) {
    if (!sessions[sid]) return;
    delete sessions[sid];
    const tile = $('diceTile-' + sid);
    if (tile) tile.remove();
    if (Object.keys(sessions).length === 0) {
        const grid = $('diceGrid');
        if (!grid.querySelector('.dice-tile')) {
            grid.innerHTML = '<div class="no-dice" id="noDice">No dice connected</div>';
        }
    }
}

function clearAllSessions() {
    sessions = {};
    $('diceGrid').innerHTML = '<div class="no-dice" id="noDice">No dice connected</div>';
}

function createDiceTile(sid) {
    const tile = document.createElement('div');
    tile.className = 'dice-tile';
    tile.id = 'diceTile-' + sid;
    tile.innerHTML =
        '<div class="dice-tile-header">' +
            '<div class="dice-tile-header-left">' +
                '<span>' + sid + '</span>' +
                '<span class="dice-tile-color-badge" id="diceBadge-' + sid + '">--</span>' +
            '</div>' +
            '<span class="dice-tile-battery" id="diceBattery-' + sid + '">--%</span>' +
        '</div>' +
        '<div class="dice-tile-face" id="diceFace-' + sid + '">-</div>' +
        '<div class="dice-tile-status" id="diceStatus-' + sid + '">Connected</div>';
    return tile;
}

function handleEvent(sid, event) {
    const s = sessions[sid];
    if (!s) return;
    const kind = event.kind;
    let detail = kind;

    switch (kind) {
        case 'RollStart':
            s.rolling = true;
            setDiceFace(sid, '...', 'rolling', 'Rolling...');
            break;
        case 'Stable':
        case 'TiltStable':
        case 'FakeStable':
        case 'MoveStable':
            s.rolling = false;
            const face = event.face;
            const cssClass = kind === 'Stable' ? 'stable' :
                             kind === 'TiltStable' ? 'tilt-stable' :
                             kind === 'FakeStable' ? 'fake-stable' :
                             kind === 'MoveStable' ? 'move-stable' : 'stable';
            setDiceFace(sid, face, cssClass, kind);
            detail = kind + ' face=' + face;
            break;
        case 'Charging':
            const charging = event.state === 'Charging';
            $('diceStatus-' + sid).textContent = charging ? 'Charging' : 'Not charging';
            detail = 'Charging: ' + event.state;
            break;
        case 'Tap':
            $('diceStatus-' + sid).textContent = 'Tap detected';
            detail = 'Tap';
            break;
        case 'DoubleTap':
            $('diceStatus-' + sid).textContent = 'Double tap detected';
            detail = 'DoubleTap';
            break;
        case 'Disconnected':
            s.rolling = false;
            setDiceFace(sid, '-', '', 'Device disconnected');
            removeSession(sid);
            detail = 'Device disconnected';
            break;
        default:
            detail = JSON.stringify(event);
    }
    log('[' + sid + '] ' + detail);
}

function setDiceFace(sid, text, cssClass, statusText) {
    const faceEl = $('diceFace-' + sid);
    if (faceEl) {
        faceEl.textContent = text;
        faceEl.className = 'dice-tile-face' + (cssClass ? ' ' + cssClass : '');
    }
    const statusEl = $('diceStatus-' + sid);
    if (statusEl) statusEl.textContent = statusText;
    const s = sessions[sid];
    if (s) s.currentFace = text;
}

function updateBattery(sid, level) {
    const el = $('diceBattery-' + sid);
    if (el) el.textContent = level + '%';
}

function renderStatus(sid, status) {
    if (status.battery_level !== undefined) {
        const el = $('diceBattery-' + sid);
        if (el) el.textContent = status.battery_level + '%';
    }
    if (status.color) {
        const badge = $('diceBadge-' + sid);
        if (badge) badge.textContent = status.color;
        const tile = $('diceTile-' + sid);
        const faceEl = $('diceFace-' + sid);
        if (tile) {
            const colorMap = {
                'Black': '#333333',
                'Red': '#e53935',
                'Green': '#43a047',
                'Blue': '#1e88e5',
                'Yellow': '#fdd835',
                'Orange': '#fb8c00'
            };
            const hex = colorMap[status.color];
            if (hex) {
                tile.style.borderColor = hex;
                if (badge) {
                    badge.style.background = hex;
                    badge.style.color = (status.color === 'Yellow' || status.color === 'Orange') ? '#000' : '#fff';
                }
                if (faceEl && !faceEl.classList.contains('rolling')) {
                    faceEl.style.color = hex;
                    faceEl.style.textShadow = '0 0 3px #fff, 0 0 5px #fff, 0 0 12px rgba(255,255,255,0.8)';
                }
            }
        }
    }
}

function renderDeviceList(devices) {
    const list = $('deviceList');
    list.innerHTML = '';
    if (devices.length === 0) {
        list.innerHTML = '<li class="empty-state">No devices found</li>';
        return;
    }
    devices.forEach(function(dev) {
        const li = document.createElement('li');
        li.innerHTML =
            '<div class="device-info">' +
                '<span class="device-name">' + escapeHtml(dev.name) + '</span>' +
                '<span class="device-addr">' + escapeHtml(dev.address) + '</span>' +
            '</div>' +
            '<span class="device-rssi">' + (dev.rssi !== null && dev.rssi !== undefined ? dev.rssi + ' dBm' : '') + '</span>';
        list.appendChild(li);
    });
}

function sendScan() {
    const duration = parseInt($('scanDuration').value, 10) || 5;
    send({ action: 'Scan', duration: duration });
    log('Scanning for ' + duration + 's...');
}

function sendGetBattery(sid) {
    send({ action: 'GetBattery', session_id: sid });
}

function sendGetStatus(sid) {
    send({ action: 'GetStatus', session_id: sid });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

window.addEventListener('load', function() {
    toggleConnection();
});
