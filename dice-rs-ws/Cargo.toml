[package]
name = "dice-rs-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebSocket server exposing GoDice dice events over a network API"
keywords = ["bluetooth", "ble", "dice", "godic", "websocket"]
categories = ["network-programming", "hardware-support"]
readme = "../README.md"

[[bin]]
name = "dice-rs-ws"
path = "src/main.rs"

[dependencies]
dice-rs = { path = "../dice-rs", version = "0.1.0" }
async-trait = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum-test = { version = "21", features = ["ws"] }
btleplug = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
