[workspace]
members = [
    "dice-rs",
    "dice-rs-cli",
    "dice-rs-controller",
    "dice-rs-ws",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/dice-rs"
homepage = "https://github.com/smearor/dice-rs"

[workspace.dependencies]
assert_cmd = "2"
async-trait = "0.1"
btleplug = "0.12"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
predicates = "3"
serde_json = "1"
smallvec = "1"
tabled = "0.21"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "signal", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
typed-builder = "0.23"
uuid = "1"
